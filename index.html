<link href="https://cdnjs.cloudflare.com/ajax/libs/vazirmatn/33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --ink:#1d1e22; --ink2:#26282e; --line:#3a3d45;
  --gold:#f4b73b; --gold-hi:#ffd25e; --leaf:#41b36b; --brick:#e0524a; --muted:#a9acb5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7d9e3e;
  font-family:'Vazirmatn','Vazir','Segoe UI',Tahoma,system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;overscroll-behavior:contain;display:block;cursor:grab; -webkit-user-select:none;user-select:none}

.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.row{display:flex;gap:8px}
.pill{background:var(--ink);border-radius:999px;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 8px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.pill.grow{flex:1}
.pill .t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.pill small{font-size:10.5px;color:var(--muted)}
.pill b{font-size:17px;font-weight:700;direction:ltr;text-align:right;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.coin{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#6b4300;
  background:radial-gradient(circle at 35% 30%,#ffe9a1,#f4b73b 60%,#c98a14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.ppl{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#34363d}
.chip{background:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;font-size:11.5px;display:flex;gap:6px;align-items:center;color:#d6d8de;transition:border-color .3s,color .3s}
.chip b{font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.chip.bad{border-color:var(--brick);color:#ffb3ad}
.chip.mid{border-color:var(--gold);color:#ffe3a0}
.chip.ok{border-color:var(--leaf);color:#a9efc3}

.toast{position:fixed;left:50%;top:max(118px,calc(env(safe-area-inset-top) + 108px));transform:translate(-50%,-8px);background:#fff;color:#1d1e22;
  padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.dock{position:fixed;left:0;right:0;bottom:0;padding:26px 0 calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(22,23,27,.95) 58%,rgba(22,23,27,0))}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 152px;scroll-snap-align:start;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.card.land{border-color:#6a5a2c;background:linear-gradient(#2b2a24,#26282e)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .ico{font-size:28px;line-height:1}
.card .cnt{font-size:11.5px;background:#17181b;border-radius:999px;padding:2px 9px;color:#c7cad2;direction:ltr;unicode-bidi:isolate}
.card .name{font-size:15px;font-weight:700}
.card .sub{font-size:11.5px;color:var(--muted);line-height:1.5;min-height:34px;white-space:pre-line}
.buy{min-height:44px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;direction:ltr;unicode-bidi:isolate}
.buy:focus-visible{outline:3px solid #fff;outline-offset:2px}
.buy.can{background:linear-gradient(#ffd25e,#f0a92a);color:#3b2600}
.buy.can:active{transform:translateY(1px)}
.buy.cant{background:#34363d;color:#9a9da6}
.buy.lock{background:#2f3137;color:#c1c4cc;font-size:12px;direction:rtl}
.buy.max{background:#27453a;color:#8fe0ae;direction:rtl}
.card.new{animation:glow 1s ease-in-out 3}
.card.shake{animation:shake .35s}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(244,183,59,.6)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.manageBtn{position:fixed;right:12px;top:105px;z-index:5;border:1px solid #d7b65b;border-radius:14px;background:linear-gradient(135deg,#3b3420,#202a35 75%);color:#fff;padding:11px 16px;font-family:inherit;font-size:13px;font-weight:800;box-shadow:0 5px 18px #0008, inset 0 1px #ffffff22;cursor:pointer;pointer-events:auto;letter-spacing:.1px;transition:transform .15s,filter .15s}.manageBtn:active{transform:scale(.96);filter:brightness(1.2)}
.modal{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.panel{width:min(560px,96vw);max-height:82vh;overflow:auto;background:#22252b;border:1px solid #50545e;border-radius:20px;padding:18px;box-shadow:0 12px 50px #0009}
.panel h2{margin:0 0 12px;font-size:20px}.panel h3{font-size:15px;margin:16px 0 8px;color:#ffd36a}.panel p,.panel label{font-size:13px;color:#d6d8de;line-height:1.8}
.panel button,.panel select,.panel input{font:inherit}.panel button{border:0;border-radius:10px;padding:9px 12px;background:#f4b73b;color:#332300;font-weight:700;cursor:pointer;margin:3px}
.panel .secondary{background:#3b4049;color:#fff}.panel .danger{background:#713b3b;color:#fff}.panel .rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #3b3f48;padding:8px 0;flex-wrap:wrap}
.panel input[type=range]{width:130px;accent-color:#f4b73b}.panel select{background:#343840;color:#fff;border:1px solid #555;padding:7px;border-radius:8px}
.mission{background:#30343c;border-radius:12px;padding:10px;margin:7px 0}.mission small{color:#b9bec8}.badge{display:inline-block;background:#3e5946;color:#a8f0b7;border-radius:20px;padding:3px 8px;font-size:11px}
.reset{display:block;margin:6px auto 0;background:none;border:0;color:#7d808a;font:inherit;font-size:11px;padding:6px 12px;cursor:pointer}
@media(max-width:600px){.manageBtn{top:112px;right:8px}.panel{max-height:86vh;padding:14px}.card{flex-basis:145px}}

.econ-card{background:linear-gradient(145deg,#303640,#252a32);border:1px solid #4b5360;border-radius:15px;padding:13px;margin:10px 0;box-shadow:0 5px 14px #0002}.panel{background:linear-gradient(155deg,#292e37,#1f2228)}.panel h3{padding:7px 10px;border-right:3px solid #f4b73b;background:linear-gradient(90deg,transparent,#ffffff08);border-radius:7px}.panel .metric{border:1px solid #ffffff0b}.panel button{transition:transform .12s,filter .12s}.panel button:active{transform:scale(.97);filter:brightness(.95)}

.bar{height:7px;background:#454b55;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#55bd79;border-radius:9px}
.econ-card input[type=range]{width:100%;accent-color:#e5b84e}.farm-card{background:linear-gradient(145deg,#2b382d,#292e36);border:1px solid #526b4e;border-radius:14px;padding:13px;margin:10px 0}.farm-stat{background:#202a24;border-radius:10px;padding:9px;font-size:12px}.farm-stat b{display:block;color:#b7ef9a;font-size:17px;margin-top:3px}.farm-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.farm-actions button{flex:1;min-width:110px}.farm-actions button:disabled{opacity:.38;filter:grayscale(1);cursor:not-allowed}.loan-row{border-top:1px solid #454c57;padding:9px 0}.hint{font-size:11px;color:#b8bec8;line-height:1.8}

<canvas id="c" aria-label="نمای شهر"></canvas>

<div class="hud">

    <div class="pill grow"><span class="coin">€</span><div class="t"><small>خزانه شهر</small><b id="money">0 €</b></div></div>
    <div class="pill"><span class="ppl"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg></span><div class="t"><small>ساکنین</small><b id="res">0</b></div></div>

const toneCache=new Map();
function tone(h,f){
  const key=h+'|'+f;let v=toneCache.get(key);if(v)return v;
  const s=h.replace('#','');
  const c=i=>Math.max(0,Math.min(255,Math.round(parseInt(s.slice(i,i+2),16)*f)));
  v='rgb('+c(0)+','+c(2)+','+c(4)+')';toneCache.set(key,v);return v;
}
function hash(x,y,s){
  let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s||0)+1,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295;
}

function makeSprite(w,h,k,fn){
  const c=document.createElement('canvas');
  c.width=Math.ceil(w*k);c.height=Math.ceil(h*k);
  const g=c.getContext('2d');g.scale(k,k);g.translate(w/2,h-4);fn(g);
  return {c:c,w:w,h:h};
}
function sShadow(g,rx,ry){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(0,0,rx,ry,0,0,6.3);g.fill();}
function tri(g,hw,y0,y1,cL,cR){
  g.fillStyle=cL;g.beginPath();g.moveTo(-hw,y0);g.lineTo(0,y0+hw*.3);g.lineTo(0,y1);g.closePath();g.fill();
  g.fillStyle=cR;g.beginPath();g.moveTo(hw,y0);g.lineTo(0,y0+hw*.3);g.lineTo(0,y1);g.closePath();g.fill();
}
function buildSprites(k){
  sprites=[
    makeSprite(30,46,k,g=>{sShadow(g,11,5);g.fillStyle='#6b4a2b';g.fillRect(-1.5,-6,3,6);
      tri(g,11,-5,-21,'#3f8a52','#2f6b3c');tri(g,9,-14,-30,'#48975c','#357a45');tri(g,6.5,-22,-38,'#52a566','#3d8b4d');}),
    makeSprite(24,34,k,g=>{sShadow(g,8,4);g.fillStyle='#6b4a2b';g.fillRect(-1.2,-5,2.4,5);
      tri(g,8,-4,-16,'#3f8a52','#2f6b3c');tri(g,6,-11,-23,'#48975c','#357a45');tri(g,4,-17,-29,'#52a566','#3d8b4d');}),
    makeSprite(30,40,k,g=>{sShadow(g,11,5);g.fillStyle='#6b4a2b';g.fillRect(-1.5,-10,3,10);
      g.fillStyle='#4f8f38';g.beginPath();g.arc(0,-22,12,0,6.3);g.fill();
      g.fillStyle='#62a844';g.beginPath();g.arc(-4,-25,8.5,0,6.3);g.fill();
      g.fillStyle='#78bd55';g.beginPath();g.arc(-6,-28,4.5,0,6.3);g.fill();}),
    makeSprite(20,16,k,g=>{sShadow(g,7,3);
      g.fillStyle='#4f8f38';g.beginPath();g.arc(-3,-5,5.5,0,6.3);g.fill();
      g.fillStyle='#62a844';g.beginPath();g.arc(3,-6,6,0,6.3);g.fill();
      g.fillStyle='#78bd55';g.beginPath();g.arc(0,-8,3.5,0,6.3);g.fill();}),
    makeSprite(25,19,k,g=>{sShadow(g,9,3);
      g.fillStyle='#777b78';g.beginPath();g.moveTo(-9,-2);g.lineTo(-6,-10);g.lineTo(-1,-15);
      g.lineTo(7,-12);g.lineTo(10,-4);g.lineTo(5,0);g.lineTo(-6,0);g.closePath();g.fill();
      g.fillStyle='#aeb2aa';g.beginPath();g.moveTo(-6,-10);g.lineTo(-1,-15);g.lineTo(4,-12);g.lineTo(-1,-8);g.closePath();g.fill();})
  ];
}

function buildWorld(){
  // Cache only the visible screen, not the entire expanded city. The previous
  // full-map canvas could reach 4096x4096 and was copied to the screen every frame.
  const k=dpr*cam.s;
  ground.width=Math.max(1,cv.width);
  ground.height=Math.max(1,cv.height);
  const g=gctx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,ground.width,ground.height);
  g.fillStyle='#7d9e3e';g.fillRect(0,0,ground.width,ground.height);
  buildSprites(1);
  g.setTransform(k,0,0,k,(W/2-cam.cx*cam.s)*dpr,(cam.ay-cam.cy*cam.s)*dpr);
  trees.length=0;
  const mapW=cityWidth(),mapH=cityHeight();
  // Determine the visible tile range by inverse-projecting all four screen
  // corners. This keeps the natural terrain surrounding the city on every side,
  // even after panning and pinch-zooming.
  const gridAt=(sx,sy)=>{
    const wx=cam.cx+(sx-W/2)/cam.s;
    const wy=cam.cy+(sy-cam.ay)/cam.s;
    return [(wy/16+wx/32)/2,(wy/16-wx/32)/2];
  };
  const corners=[gridAt(-100,-120),gridAt(W+100,-120),gridAt(-100,H+120),gridAt(W+100,H+120)];
  const xs=corners.map(p=>p[0]),ys=corners.map(p=>p[1]);
  const minGX=Math.floor(Math.min(...xs))-3,maxGX=Math.ceil(Math.max(...xs))+3;
  const minGY=Math.floor(Math.min(...ys))-3,maxGY=Math.ceil(Math.max(...ys))+3;
  for(let y=minGY;y<=maxGY;y++)for(let x=minGX;x<=maxGX;x++){
    const locked = x<0 || y<0 || x>=mapW || y>=mapH;
    if(locked){
      const p=P(x+.5,y+.5,0);
      const screenX=(p[0]-cam.cx)*cam.s+W/2;
      const screenY=(p[1]-cam.cy)*cam.s+cam.ay;
      if(screenX < -90 || screenX > W+90 || screenY < -110 || screenY > H+110)continue;
      fillTile(g,x,y,GRASS[Math.floor(hash(x,y,1)*GRASS.length)]);
      const r=hash(x,y,12);
      // Stable, deterministic vegetation and rocks around all four sides.
      if(r<.105){
        const jx=(hash(x,y,13)-.5)*.42,jy=(hash(x,y,14)-.5)*.42;
        const tx=x+.5+jx,ty=y+.5+jy,bp=P(tx,ty,0);
        if(r<.058){
          trees.push({kind:'tree',d:tx+ty,type:Math.floor(hash(x,y,15)*4),px:bp[0],py:bp[1]});
        }else{
          trees.push({kind:'rock',d:tx+ty,px:bp[0],py:bp[1]});
        }
      }
      continue;
    }
    const p=P(x+.5,y+.5,0);
    const screenX=(p[0]-cam.cx)*cam.s+W/2;
    const screenY=(p[1]-cam.cy)*cam.s+cam.ay;
    if(screenX < -90 || screenX > W+90 || screenY < -110 || screenY > H+110)continue;
    const kd=kindOf(x,y);
    drawTile(g,x,y,kd);
    if(kd==='grass'){
      const dist=Math.max(0,-x,x-21,-y,y-12);
      const dens=dist<=0?.12:Math.min(.42,.12+dist*.035);
      if(hash(x,y,2)<dens){
        const jx=(hash(x,y,3)-.5)*.5,jy=(hash(x,y,4)-.5)*.5,t=hash(x,y,7);
        const type=t<.38?0:t<.6?1:t<.88?2:3;
        const tx=x+.5+jx,ty=y+.5+jy,bp=P(tx,ty,0);
        trees.push({kind:'tree',d:tx+ty,type:type,px:bp[0],py:bp[1]});
      }
    }
  }
}

/* =====================  DRAW HELPERS  ===================== */
function poly(pts,fill,stroke){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke();}
}
const EDGE='rgba(40,28,10,.22)';
function box(x0,y0,x1,y1,z0,z1,top,left,right,edge){
  edge=edge===undefined?EDGE:edge;
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],left,edge);
  poly([P(x1,y1,z0),P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1)],right,edge);
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],top,edge);
}
function wallBox(x0,y0,x1,y1,z0,z1,c){box(x0,y0,x1,y1,z0,z1,tone(c,1.06),tone(c,.93),tone(c,.76));}
const qL=(xa,xb,za,zb,y)=>[P(xa,y,za),P(xb,y,za),P(xb,y,zb),P(xa,y,zb)];
const qR=(ya,yb,za,zb,x)=>[P(x,ya,za),P(x,yb,za),P(x,yb,zb),P(x,ya,zb)];
function gable(x0,y0,x1,y1,z,rh,cFront,cEnd,o){
  o=o||0;const ym=(y0+y1)/2;
  poly([P(x1,y1,z),P(x1,y0,z),P(x1,ym,z+rh)],cEnd,EDGE);
  poly([P(x0-o,y1+o,z),P(x1+o,y1+o,z),P(x1+o,ym,z+rh),P(x0-o,ym,z+rh)],cFront,EDGE);
}
function gableY(x0,y0,x1,y1,z,rh,cSlope,cEnd,o){
  o=o||0;const xm=(x0+x1)/2;
  poly([P(x0,y1,z),P(x1,y1,z),P(xm,y1,z+rh)],cEnd,EDGE);
  poly([P(xm,y0-o,z+rh),P(xm,y1+o,z+rh),P(x1+o,y1+o,z),P(x1+o,y0-o,z)],cSlope,EDGE);
}
function arch(a,b,z0,zs,za,toP,fill,stroke){
  const m=(a+b)/2,pts=[toP(a,z0),toP(a,zs)];
  for(let i=1;i<=5;i++){const u=i/5;pts.push(toP(a+(m-a)*u,zs+(za-zs)*Math.sin(u*Math.PI/2)));}
  for(let i=4;i>=0;i--){const u=i/5;pts.push(toP(b-(b-m)*u,zs+(za-zs)*Math.sin(u*Math.PI/2)));}
  pts.push(toP(b,zs),toP(b,z0));
  poly(pts,fill,stroke);
}
function frustum(bx,by,r0,z0,r1,z1,c,topc){
  const rm=Math.max(r0,r1);
  const gr=ctx.createLinearGradient(bx-rm,0,bx+rm,0);
  gr.addColorStop(0,tone(c,1.08));gr.addColorStop(.55,tone(c,.92));gr.addColorStop(1,tone(c,.7));
  ctx.beginPath();ctx.moveTo(bx-r1,by-z1);ctx.lineTo(bx-r0,by-z0);
  ctx.ellipse(bx,by-z0,r0,r0/2,0,Math.PI,0,true);
  ctx.lineTo(bx+r1,by-z1);
  ctx.ellipse(bx,by-z1,r1,r1/2,0,0,Math.PI,false);
  ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  if(topc){ctx.beginPath();ctx.ellipse(bx,by-z1,r1,r1/2,0,0,6.3);ctx.fillStyle=topc;ctx.fill();}
}
function emoji(ch,x,y,size){
  ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(ch,x,y);
}
function dome(cx,cy,z,rx,dh){
  const b=P(cx,cy,z);
  const gr=ctx.createLinearGradient(b[0]-rx,0,b[0]+rx,0);
  gr.addColorStop(0,'#ffe08a');gr.addColorStop(.5,'#f1b232');gr.addColorStop(1,'#b97d12');
  ctx.beginPath();ctx.moveTo(b[0]-rx,b[1]);
  ctx.bezierCurveTo(b[0]-rx,b[1]-dh*1.35,b[0]+rx,b[1]-dh*1.35,b[0]+rx,b[1]);
  ctx.ellipse(b[0],b[1],rx,rx/2,0,0,Math.PI);
  ctx.closePath();ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle=EDGE;ctx.lineWidth=.7;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(b[0]-rx*.35,b[1]-dh*.7,rx*.14,dh*.2,-.5,0,6.3);ctx.fill();
}
function shadowAt(x,y,rx,ry){const b=P(x,y,0);ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(b[0]+3,b[1]+2,rx,ry,0,0,6.3);ctx.fill();}

/* =====================  BUILDINGS  ===================== */
function drawHouse(x,y,v){
  const wall=['#f2e6cf','#dfe9ef','#f3dcc4','#e8d9e4','#e9efd3'][v%5];
  const roof=['#c4553a','#5f6f86','#a0673c','#b04b57','#4d7a6a'][(v*3+1)%5];
  const x0=x+.2,x1=x+.8,y0=y+.22,y1=y+.78,h=16,ym=(y0+y1)/2;
  shadowAt(x+.5,y+.5,26,12);
  wallBox(x0,y0,x1,y1,0,h,wall);
  poly(qL(x0+.06,x0+.17,5,11,y1),'#7fb4d6',EDGE);
  poly(qL(x0+.25,x0+.35,0,9,y1),'#6b4430',EDGE);
  poly(qL(x0+.43,x0+.54,5,11,y1),'#7fb4d6',EDGE);
  poly(qR(y0+.16,y0+.3,5,11,x1),'#5f93b5',EDGE);
  gable(x0,y0,x1,y1,h,10,tone(roof,1),tone(wall,.76),.04);
  box(x0+.1,ym-.04,x0+.2,ym+.06,h+4,h+17,tone('#9a6a55',1.05),tone('#9a6a55',.93),tone('#9a6a55',.76));
}
function drawApartment(x,y,v){
  const x0=x+.13,x1=x+.87,y0=y+.13,y1=y+.87,h=37;
  const base=['#d9e2e8','#e7d8c6','#d6dfd2'][v%3];
  shadowAt(x+.5,y+.5,30,14);
  wallBox(x0,y0,x1,y1,0,h,base);
  // Repeated blue windows and balcony bands make the mid-rise distinct.
  for(let floor=0;floor<4;floor++){
    const z=5+floor*8;
    for(let col=0;col<3;col++){
      const xa=x0+.10+col*.19,xb=xa+.105;
      poly(qL(xa,xb,z,z+4,y1),'#78b5d5',EDGE);
      poly(qR(y0+.12+col*.19,y0+.23+col*.19,z,z+4,x1),'#659bb9',EDGE);
    }
    poly(qL(x0+.04,x1-.04,z+5,z+5.8,y1),'#f5eee0',EDGE);
  }
  box(x0-.025,y0-.025,x1+.025,y1+.025,h,h+3,'#e8edf0','#cbd4d9','#aebbc3');
  const roof=P((x0+x1)/2,(y0+y1)/2,h+4);
  ctx.fillStyle='#e9a83d';ctx.beginPath();ctx.arc(roof[0],roof[1],2.5,0,6.3);ctx.fill();
}
function drawResidentialTower(x,y,v){
  const x0=x+.22,x1=x+.78,y0=y+.22,y1=y+.78,h=66;
  shadowAt(x+.5,y+.5,27,13);
  wallBox(x0,y0,x1,y1,0,h,'#a9c8d7');
  // Narrow, tall tower with a central glass strip and many floors.
  poly(qL(x0+.22,x0+.38,4,h-5,y1),'#4f819e',EDGE);
  poly(qR(y0+.13,y1-.13,4,h-5,x1),'#416f8b',EDGE);
  for(let z=7;z<h-4;z+=7){
    poly(qL(x0+.04,x0+.18,z,z+3.4,y1),'#d7eaf2',EDGE);

    poly(qR(y1-.17,y1-.06,z,z+3.4,x1),'#d7eaf2',EDGE);
  }
  box(x0-.035,y0-.035,x1+.035,y1+.035,h,h+3,'#dce8ec','#a9c4d0','#789aaa');
  const top=P((x0+x1)/2,(y0+y1)/2,h+3);
  ctx.fillStyle='#f3bd4b';ctx.fillRect(top[0]-2,top[1]-8,4,8);
}

/* ---------- Azadi Tower ---------- */
function drawAzadi(x,y,w,h){
  const cx=x+w/2,cy=y+h/2;
  shadowAt(cx,cy,52,24);
  box(cx-.95,cy-.95,cx+.95,cy+.95,0,3,'#e6e0d0','#d0c9b5','#aaa38f');
  box(cx-.82,cy-.82,cx+.82,cy+.82,3,6,'#efe9db','#d9d2c0','#b3ac98');
  const a=.62,xl=cx+a,yl=cy+a;
  wallBox(cx-a,cy-a,cx+a,cy+a,6,42,'#f3efe4');
  arch(cx-.4,cx+.4,6,24,39,(t,z)=>P(t,yl,z),'#9eb9c8',EDGE);
  arch(cx-.3,cx+.3,6,22,34,(t,z)=>P(t,yl,z),'#546d7f');

const bObjs=[],walkers=[],cars=[],custs=[],parts=[],floats=[];
let pulse=0,now=0;

function addBuilding(k,i,animate){
  const slots=PLOTS[k];
  // Purchase limits are removed. Reuse the available visual plots after the map's
  // predefined spaces are filled, while keeping every purchase in the economy.
  const p=slots[i % slots.length],w=p[2]||1,h=p[3]||1;
  const batch=Math.floor(i/slots.length),x=p[0]+batch*4,y=p[1];
  const o={kind:'bld',k:k,i:i,x:x,y:y,w:w,h:h,cx:x+w/2,cy:y+h/2,d:x+w+y+h-1,
    born:animate?now:-10,t:animate?-.7:Math.random()*(TYPES[k].iv||1),door:doorOf(x,y,w,h)};
  bObjs.push(o);return o;
}
function syncBuildings(){
  bObjs.length=0;
  ORDER.forEach(k=>{for(let i=0;i<S.n[k];i++)addBuilding(k,i,false);});
}
function placeActor(a){
  if(a.axis==='x'){a.x=a.p;a.y=a.lane;}else{a.x=a.lane;a.y=a.p;}
  a.d=a.x+a.y;
}
function spawnWalker(){

    p:r.min+.5+Math.random()*(r.max-r.min-1),dir:Math.random()<.5?1:-1,sp:.35+Math.random()*.3,

  placeActor(a);walkers.push(a);
}
function spawnCar(){
  const r=ROADS[Math.floor(Math.random()*ROADS.length)],dir=Math.random()<.5?1:-1;
  const a={kind:'car',axis:r.axis,lane:r.c+(dir>0?.3:.7),min:r.min+.4,max:r.max-.4,

function syncPeople(){
  const wt=Math.min(14,Math.ceil(S.res/4)),ct=Math.min(6,Math.floor(S.res/12));
  while(walkers.length<wt)spawnWalker();
  while(walkers.length>wt)walkers.pop();
  while(cars.length<ct)spawnCar();
  while(cars.length>ct)cars.pop();
}
function moveActor(a,dt,bounce){
  a.p+=a.dir*a.sp*dt;
  if(a.p>a.max){if(bounce){a.p=a.max;a.dir=-1;}else a.p=a.min;}
  else if(a.p<a.min){if(bounce){a.p=a.min;a.dir=1;}else a.p=a.max;}
  placeActor(a);
}

/* ---------- customers (they pay when they shop) ---------- */
function spawnCustomer(b){
  // Customer animations are visual only: when the crowd is full, settle the sale
  // immediately so performance limits never reduce the city's actual income.
  if(custs.length>=28){collectCustomerSale(b);return;}
  const dr=b.door,r=dr.road,sign=Math.random()<.5?-1:1;
  const clampP=v=>Math.max(r.min+.5,Math.min(r.max-.5,v));
  let p0=clampP(dr.p+sign*(2+Math.random()*3));
  if(Math.abs(p0-dr.p)<1.2)p0=clampP(dr.p-sign*(2+Math.random()*3));
  const c={kind:'cust',b:b,axis:r.axis,lane:dr.lane,p:p0,state:'in',st:0,alpha:1,sp:1+Math.random()*.4,
    c:WALK[Math.floor(Math.random()*WALK.length)],skin:['#f0c8a5','#d9a47e','#b97855'][Math.floor(Math.random()*3)],hair:['#3a2923','#55402f','#22252b','#9a754c'][Math.floor(Math.random()*4)],stature:.78+Math.random()*.42,body:Math.random()<.16?'child':(Math.random()<.12?'elder':'adult'),bag:null,r:r,ph:Math.random()*6,exitP:0,x:0,y:0,d:0};
  placeActor(c);custs.push(c);
}
function collectCustomerSale(b){
  const T=TYPES[b.k],sale=T.inc*T.iv*(S.bizGrowth?.[b.k]||1);
  earn(sale);
  const active=(S.bizLoans||[]).filter(x=>x.type===b.k&&x.remaining>0);
  active.forEach(x=>{const installment=Math.min(x.remaining,Math.max(1,x.totalPay/Math.max(1,x.termSales||60)));x.remaining-=installment;x.paid=(x.paid||0)+installment;earn(installment);});
  return sale;
}
function payCustomer(c){
  const b=c.b,T=TYPES[b.k],sale=collectCustomerSale(b);
  const a=P(b.cx,b.cy,T.top||26);
  floatText(a[0],a[1],'+'+fmt(sale)+' €',T.land?'#ffe27a':'#a8f0b4',T.land?17:14);
  burst(a[0],a[1]+10,'coin',T.land?4:2);
}
function updateCust(c,dt,idx){
  const b=c.b,T=TYPES[b.k];
  if(c.state==='in'){
    const dd=b.door.p-c.p,step=c.sp*dt;
    if(Math.abs(dd)<=step){c.p=b.door.p;c.state='enter';c.st=0;}else c.p+=Math.sign(dd)*step;
  }else if(c.state==='enter'){
    c.st+=dt;c.alpha=Math.max(0,1-c.st/.45);
    if(c.st>=.45){payCustomer(c);c.state='exit';c.st=0;c.bag=T.bag;}
  }else if(c.state==='exit'){
    c.st+=dt;c.alpha=Math.min(1,c.st/.45);
    if(c.st>=.45){
      c.alpha=1;c.state='out';
      const s=Math.random()<.5?-1:1,r=c.r;
      c.exitP=Math.max(r.min+.5,Math.min(r.max-.5,b.door.p+s*(2+Math.random()*2.5)));
    }
  }else if(c.state==='out'){
    const dd=c.exitP-c.p,step=c.sp*dt;
    if(Math.abs(dd)<=step){c.p=c.exitP;c.state='fade';c.st=0;}else c.p+=Math.sign(dd)*step;
  }else{
    c.st+=dt;c.alpha=Math.max(0,1-c.st/.4);
    if(c.st>=.4){custs.splice(idx,1);return;}

function draw(t,dt){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#7d9e3e';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(ground,0,0);
  const k=dpr*cam.s;
  ctx.setTransform(k,0,0,k,(W/2-cam.cx*cam.s)*dpr,(cam.ay-cam.cy*cam.s)*dpr);
  const list=renderList;list.length=0;
  for(let i=0;i<trees.length;i++){
    const o=trees[i],sx=(o.px-cam.cx)*cam.s+W/2,sy=(o.py-cam.cy)*cam.s+cam.ay;
    if(sx>-50&&sx<W+50&&sy>-30&&sy<H+90)list.push(o);
  }
  // Cull off-screen entities before sorting; late-game cities can contain
  // many buildings, so sorting the entire city every frame caused stutter.
  const onScreen=(o,pad=100)=>{
    const q=P(o.x+(o.w||0)/2,o.y+(o.h||0)/2,0);
    const sx=(q[0]-cam.cx)*cam.s+W/2,sy=(q[1]-cam.cy)*cam.s+cam.ay;
    return sx>-pad&&sx<W+pad&&sy>-pad&&sy<H+pad;
  };
  for(let i=0;i<bObjs.length;i++)if(onScreen(bObjs[i],180))list.push(bObjs[i]);
  for(let i=0;i<walkers.length;i++)if(onScreen(walkers[i],60))list.push(walkers[i]);
  for(let i=0;i<cars.length;i++)if(onScreen(cars[i],80))list.push(cars[i]);
  for(let i=0;i<custs.length;i++)if(onScreen(custs[i],70))list.push(custs[i]);
  list.push(bank);
  for(let i=0;i<renderSignals.length;i++)list.push(renderSignals[i]);
  list.sort((a,b)=>a.d-b.d);
  for(let i=0;i<list.length;i++){
    const o=list[i];
    switch(o.kind){
      case 'tree':{const sp=sprites[o.type];ctx.drawImage(sp.c,o.px-sp.w/2,o.py-sp.h+4,sp.w,sp.h);break;}
      case 'rock':{const sp=sprites[4];ctx.drawImage(sp.c,o.px-sp.w/2,o.py-sp.h+4,sp.w,sp.h);break;}
      case 'bld':drawBld(o,t);break;
      case 'walker':drawWalker(o,t);break;
      case 'cust':if(o.alpha>.02)drawWalker(o,t,o.alpha,o.bag);break;

      case 'bank':drawBank(t);break;
      case 'signal':drawTrafficLight(o.x,o.y,t);break;

/* ===================== INPUT: unified Pointer Events camera controls ===================== */
const activePointers=new Map();
let drag=null, pinch=null, gestureConsumed=false, pointerStart=null;
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

function beginPinch(){
  if(activePointers.size<2)return;
  const pts=[...activePointers.values()].slice(0,2),mid=midpoint(pts[0],pts[1]);
  pinch={distance:Math.max(1,distance(pts[0],pts[1])),scale:cam.s,
    anchorX:cam.cx+(mid.x-W/2)/cam.s,
    anchorY:cam.cy+(mid.y-cam.ay)/cam.s};
  drag=null;gestureConsumed=true;
}
function moveCameraPointers(){
  if(activePointers.size>=2&&pinch){
    const pts=[...activePointers.values()].slice(0,2),mid=midpoint(pts[0],pts[1]);
    const ratio=distance(pts[0],pts[1])/Math.max(1,pinch.distance);
    const next=Math.max(cam.baseS*.55,Math.min(cam.baseS*2.8,pinch.scale*ratio));
    cam.s=next;updateCamBounds();
    cam.cx=pinch.anchorX-(mid.x-W/2)/next;
    cam.cy=pinch.anchorY-(mid.y-cam.ay)/next;
    clampCam();scheduleGroundRebuild();return;
  }
  if(activePointers.size===1&&drag){
    const p=activePointers.get(drag.id);if(!p)return;
    if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>7)gestureConsumed=true;
    cam.cx-=(p.x-drag.x)/cam.s;cam.cy-=(p.y-drag.y)/cam.s;
    drag.x=p.x;drag.y=p.y;clampCam();scheduleGroundRebuild();
  }
}
cv.addEventListener('pointerdown',e=>{
  // Only start a gesture on the actual map canvas, never on the shop drawer/buttons.
  if(e.target!==cv)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===1){
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};
    pointerStart={x:e.clientX,y:e.clientY};gestureConsumed=false;pinch=null;
  }else if(activePointers.size>=2){beginPinch();}
  cv.style.cursor='grabbing';
},{passive:false});

// Listen on window without setPointerCapture: Android WebViews can lose a second
// touch after pointer capture, while window listeners keep tracking outside canvas.
window.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  e.preventDefault();
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moveCameraPointers();
},{passive:false});

function endCameraPointer(e){
  if(!activePointers.has(e.pointerId))return;
  e.preventDefault();
  const wasSingle=activePointers.size===1;
  activePointers.delete(e.pointerId);
  if(activePointers.size>=2){
    beginPinch();
  }else if(activePointers.size===1){
    const [id,p]=[...activePointers.entries()][0];
    drag={id,x:p.x,y:p.y,sx:p.x,sy:p.y};
    pinch=null;gestureConsumed=true;
  }else{
    if(wasSingle&&!gestureConsumed&&pointerStart)
      selectFarmAt(pointerStart.x,pointerStart.y);
    drag=null;pinch=null;pointerStart=null;gestureConsumed=false;
    cv.style.cursor='grab';
  }
}
window.addEventListener('pointerup',endCameraPointer,{passive:false});
window.addEventListener('pointercancel',endCameraPointer,{passive:false});
window.addEventListener('blur',()=>{
  activePointers.clear();drag=null;pinch=null;pointerStart=null;gestureConsumed=false;
  cv.style.cursor='grab';
});

function buy(k){
  const T=TYPES[k];
  const requiredPop = k==='airport' ? [100,200,700][Math.min(S.n.airport,2)] : T.need;
  if(S.n[k]>=Math.min(T.max,buildingLimit(k))||S.res<requiredPop||S.expansion<requiredExpansion(k))return;
  const c=cost(k);
  if(S.money<c){shake(k);return;}
  S.money=Math.max(0,Number(S.money)||0)-c;markPurchase();
  const i=S.n[k];S.n[k]++;
  if(k==='university'){const sd=S.schoolData||(S.schoolData={strictness:50,progress:0,graduates:0,elite:0,uniQueue:0,uniProgress:0,uniGraduates:0});sd.uniQueue=Math.max(Number(sd.uniQueue)||0,(Number(sd.graduates)||0)-(Number(sd.uniGraduates)||0));}
  const o=addBuilding(k,i,true);
  const a=P(o.cx,o.cy,18);
  floatText(a[0],a[1],'-'+fmt(c)+' €','#ff7a6e',19);
  burst(a[0],a[1]+14,'dust',9);
  vib(15);playTone(540,.12);

function expandCity(){
  const level=S.expansion||0;
  const price=Math.round(50000*Math.pow(2.15,level)*inflation());if(S.money<price){shake('expand');return;}
  S.money-=price;markPurchase();S.expansion=level+1;
  // Extend every existing road through the new district. Previously some
  // road segments were missing/misaligned, so customers in the new area
  // could never reach shops and their sales income stayed at zero.
  rebuildRoadNetwork();
  // Preserve the current view; only expand the camera's travel limits.
  updateCamBounds();clampCam();buildWorld();
  // Refresh the HUD immediately so the expansion state and income stay in sync.
  refresh();
  // Recompute active buildings' road exits against the expanded road network.
  bObjs.forEach(b=>{b.door=doorOf(b.x,b.y,b.w,b.h);});
  toast('شهر گسترش پیدا کرد! همه منطقه‌ها قابل دسترسی‌اند و مسیر درآمد فعال شد 🏙️',3500);refresh();save();
}
function upgrade(){

  const a=P(8,8,bankTopZ());
  floatText(a[0],a[1],'-'+fmt(c)+' €','#ff7a6e',19);
  burst(a[0],a[1]+10,'spark',16);burst(a[0],a[1]+10,'coin',6);
  vib([12,40,12]);

}

async function load(){
  try{
    if(window.storage){
      const r=await window.storage.get(KEY);
      if(r&&r.value){
        const d=JSON.parse(r.value),f=fresh();
        S=Object.assign(f,d);
        S.n=Object.assign(fresh().n,d.n||{});
        S.unl=Object.assign(fresh().unl,d.unl||{});
        S.expansion=Math.max(0,Number(d.expansion)||0);
        // Recalculate population room from all residential buildings in old/new saves.
        S.res=Math.min(Number(S.res)||0,capacity());
      }
    }else{
      const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw),f=fresh();S=Object.assign(f,d);S.n=Object.assign(f.n,d.n||{});S.unl=Object.assign(f.unl,d.unl||{});}
    }
    const f=fresh();S=Object.assign(f,S);S.purchases=Math.max(0,Math.min(150,Math.floor(Number(S.purchases)||0)));S.money=Number.isFinite(Number(S.money))?Math.max(0,Number(S.money)):200;S.total=Number.isFinite(Number(S.total))?Math.max(0,Number(S.total)):0;S.n=Object.assign(f.n,S.n||{});S.unl=Object.assign(f.unl,S.unl||{});S.inventions=Array.isArray(S.inventions)?S.inventions:[];S.bizLoans=Array.isArray(S.bizLoans)?S.bizLoans:[];S.bizGrowth=Object.assign(f.bizGrowth,S.bizGrowth||{});S.farmData=Object.assign(f.farmData,S.farmData||{});S.schoolData=Object.assign(f.schoolData,S.schoolData||{});S.citySystems=Object.assign(f.citySystems,S.citySystems||{});S.buildingLevels=Object.assign({},S.buildingLevels||{});S.policy=S.policy||'balanced';S.mayorPopularity=Number(S.mayorPopularity)||55;S.tradeCount=Number(S.tradeCount)||0;S.tradeReadyAt=Math.max(0,Number(S.tradeReadyAt)||0);S.personalLoan=Math.max(0,Number(S.personalLoan)||0);S.personalLoanDue=Math.max(0,Number(S.personalLoanDue)||0);S.missionStage=Math.max(0,Number(S.missionStage)||0);S.claimed=Array.isArray(S.claimed)?S.claimed:[];if(!S.taxPercent)S.taxPercent=[7,12,19][Number(S.taxPolicy??1)]||12;
    const away=Math.max(0,Math.min(8*3600,(Date.now()-(Number(S.lastSeen)||Date.now()))/1000));
    const gain=away*((S.n.auto||0)*TYPES.auto.passive+farmIncomeRate()+(S.res*taxRate()*.25)+((S.schoolData?.uniGraduates||0)*.22)+(systems().buses||0)*.7+(systems().taxis||0)*.35+tourismScore()*.2);if(gain>0){earn(gain);S.offlineGain=gain;}
  }catch(e){}

let last=0,arr=0,saveT=0,uiT=0,lastDraw=0,rateT=0,slowDraws=0,fastDraws=0,adaptiveLow=false;
const hist=[];
function trackRate(t){
  const cs=systems();
  const transitIncome=(cs.buses||0)*1.4+(cs.taxis||0)*.7;
  const tourismIncome=tourismScore()*.55;
  const districtBoost=cs.district==='commercial'?1.18:
    cs.district==='industrial'?1.16:cs.district==='tourism'?1.2:
    cs.district==='residential'?1.08:1;
  const policy=policyIncome();
  const base=(S.res*taxRate()
    +(S.n.auto||0)*TYPES.auto.passive*levelBoost('auto')
    +farmIncomeRate()
    +(S.schoolData?.graduates||0)*.025
    +(S.schoolData?.elite||0)*.06
    +(S.schoolData?.uniGraduates||0)*.22
    +transitIncome+(cs.metro||0)*2.2
    +tourismIncome*levelBoost('hotel'))*districtBoost*policy;
  // Customer businesses pay T.inc on average per second. This makes the HUD
  // show their expected income even between individual customer animations.
  let business=0;
  for(const k of ORDER){
    const T=TYPES[k];
    if(T.iv&&T.inc)business+=(S.n[k]||0)*T.inc*(S.bizGrowth?.[k]||1);
  }
  const innovation=(S.inventions?.includes('solar')?.04:0)
    +(S.inventions?.includes('ai')?.08:0);
  const farmExtra=S.inventions?.includes('smartfarm')?farmIncomeRate()*.15:0;
  rate=Math.max(0,(base*(1+innovation)+farmExtra+business)
    *(S.eventLeft>0?(S.eventBoost||1):1));
}
function frame(ts){
  const t=ts/1000;now=t;
  const rawDt=last?Math.max(0,(t-last)):.016;const dt=Math.min(.1,Number.isFinite(rawDt)?rawDt:.016);last=t;S.dayTime=(S.dayTime||0)+dt;
  S.inventions=Array.isArray(S.inventions)?S.inventions:[];
  const sdNow=S.schoolData||{};
  const inventions=[['solar',5],['smartfarm',15],['ai',30]];
  for(const [id,threshold] of inventions){if((sdNow.elite||0)>=threshold&&!S.inventions.includes(id)){S.inventions.push(id);toast('اختراع جدید کشف شد: '+({solar:'پنل خورشیدی',smartfarm:'آبیاری هوشمند',ai:'هوش مصنوعی شهری'}[id]));save();}}
  // Use one shared income calculation for both the live HUD and actual treasury.
  // Previously the HUD included shop/customer-business income, but the wallet
  // only received tax/farm/utility income, so displayed and paid income diverged.
  rateT+=dt;if(rateT>=.5){rateT=0;trackRate(t);}
  earn(rate*dt);
  if(S.n.school){const sd=S.schoolData||(S.schoolData={strictness:50,progress:0,graduates:0,elite:0,uniQueue:0,uniProgress:0,uniGraduates:0});sd.progress=(sd.progress||0)+dt*S.n.school*(.55+(sd.strictness??50)/100*.65);while(sd.progress>=60){sd.progress-=60;sd.graduates=(sd.graduates||0)+1;if((sd.strictness??50)>=65&&Math.random()<((sd.strictness-55)/100)){sd.elite=(sd.elite||0)+1;}if(S.n.university){sd.uniQueue=(sd.uniQueue||0)+1;}}if(S.n.university&&(sd.uniQueue||0)>0){sd.uniProgress=(sd.uniProgress||0)+dt*.8;while(sd.uniProgress>=60&&sd.uniQueue>0){sd.uniProgress-=60;sd.uniQueue--;sd.uniGraduates=(sd.uniGraduates||0)+1;}}}
  if(S.loanDue>0){S.loanDue=Math.max(0,S.loanDue-dt*0);}
  // Public services slightly improve business demand and resident growth.
  bank.t=Math.min((bank.t||0)+dt,BANK.iv[S.lvl-1]*1.5);const iv=BANK.iv[S.lvl-1];
  if(bank.t>=iv){bank.t=0;payout();}
  const cap=capacity();
  if(S.res<cap){arr+=dt*(1.25*(happiness()/70)+(S.n.school||0)*.12+(S.n.university||0)*.18);while(arr>=1&&S.res<cap){S.res++;arr-=1;}}else arr=0;
  if(happiness()<38&&S.res>0){S.emigrationTimer=(S.emigrationTimer||0)+dt;if(S.emigrationTimer>25){S.emigrationTimer=0;S.res=Math.max(0,S.res-1);}}else S.emigrationTimer=0;
  S.eventClock=(S.eventClock||0)+dt;if((S.eventLeft||0)>0)S.eventLeft=Math.max(0,S.eventLeft-dt);if(S.eventClock>=75){S.eventClock=0;const ev=[['جشنواره شهری 🎉',1.35],['نمایشگاه فناوری 🧪',1.25],['تعطیلات گردشگری 🧳',1.4],['بازار هفتگی 🛍️',1.2],['روز پاکیزگی ♻️',1.12]][Math.floor(Math.random()*5)];S.eventName=ev[0];S.eventBoost=ev[1];S.eventLeft=22;toast('رویداد شهر: '+ev[0]+' · درآمد بیشتر برای مدت کوتاه',3200);save();}
  pulse=Math.max(0,pulse-dt*4.5);
  for(let i=0;i<bObjs.length;i++){
    const b=bObjs[i],T=TYPES[b.k];
    if(T.iv){b.t+=dt;if(b.t>=T.iv){b.t-=T.iv;spawnCustomer(b);}}
  }
  walkers.forEach(a=>moveActor(a,dt,true));
  cars.forEach(a=>moveActor(a,dt,false));
  for(let i=custs.length-1;i>=0;i--)updateCust(custs[i],dt,i);
  uiT+=dt;if(uiT>.3){uiT=0;syncPeople();refresh();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  const targetFrame=adaptiveLow?1/20:(W<700?1/24:1/30);
  if(!document.hidden&&(t-lastDraw>=targetFrame || !lastDraw)){
    const drawDt=lastDraw?Math.min(.1,t-lastDraw):dt;
    lastDraw=t;
    const drawStart=performance.now();
    draw(t,drawDt);
    const drawCost=performance.now()-drawStart;
    if(drawCost>30){slowDraws++;fastDraws=0;}else if(drawCost<19){fastDraws++;slowDraws=0;}
    if(slowDraws>=35){adaptiveLow=true;slowDraws=0;}
    if(fastDraws>=120){adaptiveLow=false;fastDraws=0;}
  }
  requestAnimationFrame(frame);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,S.quality==='low'?1:(S.quality==='medium'?1.15:1.35));
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const fitted=Math.max(.3,Math.min(W/(14*64),(H*.55)/600));if(!cam.init){cam.baseS=fitted;cam.s=fitted;}else{cam.baseS=fitted;cam.s=Math.max(cam.baseS*.65,Math.min(cam.baseS*2.35,cam.s));}
  cam.ay=H*.40;
  updateCamBounds();
  if(!cam.init){
    // Always open on the original downtown/bank area. Centering on the
    // expanded map's midpoint stranded the player in newly unlocked empty land.
    const home=P(8,8,0);
    cam.cx=home[0];cam.cy=home[1];cam.init=true;
  }
  clampCam();
  buildWorld();
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,80);});

if(window.__DEBUG)window.__dbg={S:()=>S,buy:buy,upgrade:upgrade,setS:o=>Object.assign(S,o),frames:()=>({custs:custs.length,walkers:walkers.length,cars:cars.length})};

(async function init(){
  await load();
  rebuildRoadNetwork();
  resize();syncBuildings();
  // Assign correct doors after loading a saved expanded city.
  bObjs.forEach(b=>{b.door=doorOf(b.x,b.y,b.w,b.h);});
  syncPeople();refresh();
  if(S.offlineGain>0){toast('وقتی نبودی '+fmt(S.offlineGain)+' € درآمد داشتی! 💰',5000);delete S.offlineGain;save();}
  else if(S.total===0&&S.n.house===0)toast('بانک هر ۵ ثانیه پول می‌ده · خونه بساز تا ساکن بیاد',4200);
  requestAnimationFrame(frame);
})();
})();
</script>
